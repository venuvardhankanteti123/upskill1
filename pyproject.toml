[project]
name = "upskill"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "venuvardhankanteti123", email = "venuvardhankantheti@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "certifi==2026.10.23",
    "charset-normalizer==3.5.2",
    "fastapi[standard]>=0.162.0",
    "idna==3.20",
    "ipykernel>=7.4.0",
    "requests==2.34.2",
    "torch>=2.14.1",
    "urllib3==2.8.0",
]

[project.scripts]
upskill = "upskill:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
